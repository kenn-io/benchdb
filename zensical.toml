[project]
site_name = "BenchDB"
site_description = "Language-independent continuous benchmarking with a Go API, Svelte dashboard, CLI-first writes, and generated clients."
site_author = "Kenn Software LLC"
docs_dir = "docs/site"
site_dir = "site/docs"
site_url = "https://benchdb.io/docs/"
repo_url = "https://github.com/kenn-io/benchdb"
repo_name = "kenn-io/benchdb"
use_directory_urls = true
extra_css = ["stylesheets/extra.css"]
dev_addr = "localhost:8000"
nav = [
  { "Overview" = "index.md" },
  { "Start here" = [
    "quickstart.md",
    "concepts.md",
  ] },
  { "Publish benchmarks" = [
    "submitting-results.md",
    "ci-reporting.md",
  ] },
  { "Investigate results" = [
    "browsing-and-comparing.md",
    "regression-analysis.md",
    "dashboard-screenshots.md",
  ] },
  { "Automate" = [
    "agents.md",
    "alerting.md",
    "api-and-sdk.md",
    "cli-reference.md",
  ] },
  { "Operate" = [
    "auth-and-tokens.md",
    "operations.md",
    "upgrading.md",
    "prod-clone-compatibility.md",
    "storage-roadmap.md",
    "contributing.md",
  ] },
]

[project.theme]
features = [
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.tracking",
  "navigation.path",
  "navigation.sections",
  "content.code.copy",
]

[[project.theme.palette]]
scheme = "slate"
primary = "black"
accent = "blue"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "white"
accent = "blue"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"
