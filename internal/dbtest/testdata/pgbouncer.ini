; Rendered per test by internal/dbtest. PoolMode, DatabaseHost, and DatabaseName
; come from the test; the credentials live in the generated userlist.txt.
[databases]
{{.DatabaseName}} = host={{.DatabaseHost}} port=5432 dbname={{.DatabaseName}}

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = {{.PoolMode}}
; Large enough that session mode never queues clients that each pin a backend,
; small enough to stay under PostgreSQL's default max_connections of 100.
default_pool_size = 20
max_client_conn = 200
ignore_startup_parameters = extra_float_digits
