name: Storage provider tests

# Live S3 and GCS runs of the archive engine. The cloud identities trust only
# this workflow on main, in the storage-tests environment, so it runs on
# demand and daily rather than on pull requests.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 7 * * *"

permissions:
  contents: read

concurrency:
  group: storage-provider-tests
  cancel-in-progress: false

jobs:
  live:
    name: Live S3 and GCS archive
    runs-on: namespace-profile-linux-8cpu
    environment: storage-tests
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      BENCHDB_DUCKDB_EXTENSION_DIR: ${{ github.workspace }}/.cache/duckdb/extensions
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make duckdb-extensions

      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.STORAGE_TESTS_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STORAGE_TESTS_GCP_SERVICE_ACCOUNT }}

      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.STORAGE_TESTS_AWS_ROLE_ARN }}
          aws-region: ${{ vars.STORAGE_TESTS_AWS_REGION }}

      - name: Run the archive against S3 and GCS
        env:
          BENCHDB_LIVE_S3_URL: s3://${{ vars.STORAGE_TESTS_S3_BUCKET }}/benchdb
          BENCHDB_LIVE_GCS_URL: gs://${{ vars.STORAGE_TESTS_GCS_BUCKET }}/benchdb
        # A skipped subtest means the provider was never reached, so it fails.
        run: |
          set -o pipefail
          go test -shuffle=on -timeout 20m -v -run '^TestLiveRemoteArchive$' ./internal/columnar | tee live.log
          for provider in s3 gcs; do
            grep -q -- "--- PASS: TestLiveRemoteArchive/${provider} " live.log ||
              { echo "TestLiveRemoteArchive/${provider} did not run and pass" >&2; exit 1; }
          done
