name: website

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build_docs_site.py'
      - 'scripts/docs_*'
      - 'scripts/sync_docs_assets.sh'
      - 'scripts/sync_docs_screenshots.sh'
      - 'website/**'
      - 'Makefile'
      - 'requirements-docs.txt'
      - 'zensical.toml'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/build_docs_site.py'
      - 'scripts/docs_*'
      - 'scripts/sync_docs_assets.sh'
      - 'scripts/sync_docs_screenshots.sh'
      - 'website/**'
      - 'Makefile'
      - 'requirements-docs.txt'
      - 'zensical.toml'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out product screenshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs-assets
          path: .ci-docs-assets
          persist-credentials: false
      - name: Capture dashboard screenshots
        env:
          BENCHDB_DOCS_SCREENSHOT_OUT_DIR: ${{ runner.temp }}/benchdb-dashboard-screenshots
        run: make docs-screenshots
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          enable-cache: true
      - name: Build the complete website
        env:
          BENCHDB_DOCS_ASSET_SOURCE: ${{ github.workspace }}/.ci-docs-assets/benchmark-series.png
          BENCHDB_DOCS_SCREENSHOT_SOURCE_DIR: ${{ runner.temp }}/benchdb-dashboard-screenshots
        run: make build-docs
      - name: Check first paint
        uses: kenn-io/actions/first-paint@b523fb403607f01de5eec5f4556c7668544c70fe # main
        with:
          dist: site
