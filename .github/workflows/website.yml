name: website

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build_docs_site.py'
      - 'scripts/docs_*'
      - 'scripts/sync_docs_assets.sh'
      - 'scripts/sync_docs_screenshots.sh'
      - 'website/**'
      - 'Makefile'
      - 'requirements-docs.txt'
      - 'zensical.toml'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/build_docs_site.py'
      - 'scripts/docs_*'
      - 'scripts/sync_docs_assets.sh'
      - 'scripts/sync_docs_screenshots.sh'
      - 'website/**'
      - 'Makefile'
      - 'requirements-docs.txt'
      - 'zensical.toml'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check out product screenshot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: docs-assets
          path: .ci-docs-assets
          persist-credentials: false
      - name: Capture dashboard screenshots
        env:
          BENCHDB_DOCS_SCREENSHOT_OUT_DIR: ${{ runner.temp }}/benchdb-dashboard-screenshots
        run: make docs-screenshots
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Build the complete website
        env:
          BENCHDB_DOCS_ASSET_SOURCE: ${{ github.workspace }}/.ci-docs-assets/benchmark-series.png
          BENCHDB_DOCS_SCREENSHOT_SOURCE_DIR: ${{ runner.temp }}/benchdb-dashboard-screenshots
        run: make build-docs
      - name: Check first paint
        uses: kenn-io/actions/first-paint@ee1ddcce6a620e49ba96f613bb8d113e0193b4f6 # first-paint, kenn-io/actions#6
        with:
          dist: site
