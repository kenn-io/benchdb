name: website

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build_docs_site.py'
      - 'scripts/docs_*'
      - 'scripts/sync_docs_assets.sh'
      - 'scripts/sync_docs_screenshots.sh'
      - 'website/**'
      - 'Makefile'
      - 'requirements-docs.txt'
      - 'zensical.toml'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/build_docs_site.py'
      - 'scripts/docs_*'
      - 'scripts/sync_docs_assets.sh'
      - 'scripts/sync_docs_screenshots.sh'
      - 'website/**'
      - 'Makefile'
      - 'requirements-docs.txt'
      - 'zensical.toml'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions: {}

jobs:
  build:
    env:
      DOWNLOAD_RETRY: kit-retry 3 5
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check out product screenshot
        uses: actions/checkout@v7.0.1
        with:
          ref: docs-assets
          path: .ci-docs-assets
          persist-credentials: false
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.48.1
      - name: Capture dashboard screenshots
        env:
          BENCHDB_DOCS_SCREENSHOT_OUT_DIR: ${{ runner.temp }}/benchdb-dashboard-screenshots
        run: make docs-screenshots
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Build the complete website
        env:
          BENCHDB_DOCS_ASSET_SOURCE: ${{ github.workspace }}/.ci-docs-assets/benchmark-series.png
          BENCHDB_DOCS_SCREENSHOT_SOURCE_DIR: ${{ runner.temp }}/benchdb-dashboard-screenshots
        run: make build-docs
      - name: Check first paint
        uses: kenn-io/actions/first-paint@main
        with:
          dist: site
