name: website

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build_docs_site.py'
      - 'scripts/docs_*'
      - 'scripts/sync_docs_assets.sh'
      - 'scripts/sync_docs_screenshots.sh'
      - 'website/**'
      - 'Makefile'
      - 'requirements-docs.txt'
      - 'zensical.toml'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/build_docs_site.py'
      - 'scripts/docs_*'
      - 'scripts/sync_docs_assets.sh'
      - 'scripts/sync_docs_screenshots.sh'
      - 'website/**'
      - 'Makefile'
      - 'requirements-docs.txt'
      - 'zensical.toml'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions: {}

jobs:
  build:
    env:
      DOWNLOAD_RETRY: kit-retry 3 5
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Check out product screenshot
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: docs-assets
          path: .ci-docs-assets
          persist-credentials: false
      - name: Capture dashboard screenshots
        env:
          BENCHDB_DOCS_SCREENSHOT_OUT_DIR: ${{ runner.temp }}/benchdb-dashboard-screenshots
        run: make docs-screenshots
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.13.4"
          enable-cache: true
      - uses: kenn-io/kit/.github/actions/kit-retry@19ca4ee42e3452f57ba6d72cf07ce5963b26219b # v0.47.3
      - name: Build the complete website
        env:
          BENCHDB_DOCS_ASSET_SOURCE: ${{ github.workspace }}/.ci-docs-assets/benchmark-series.png
          BENCHDB_DOCS_SCREENSHOT_SOURCE_DIR: ${{ runner.temp }}/benchdb-dashboard-screenshots
        run: make build-docs
      - name: Check first paint
        uses: kenn-io/actions/first-paint@ee1ddcce6a620e49ba96f613bb8d113e0193b4f6 # first-paint, kenn-io/actions#6
        with:
          dist: site
