name: release image

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - Dockerfile.server
      - Dockerfile.server.dockerignore
      - go.mod
      - go.sum
      - web/**
      - cmd/**
      - internal/**
      - sdk/go/**
      - scripts/release_image.sh
      - scripts/test_release_image.py
      - scripts/install_duckdb_extensions.sh
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: namespace-profile-linux-8cpu
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Test release metadata validation
        run: python3 -B -m unittest scripts.test_release_image
      - uses: step-security/setup-qemu-action@v4.4.0
        with:
          platforms: arm64
      - uses: step-security/setup-buildx-action@v4.4.1
      - name: Build both supported platforms without publishing
        uses: step-security/docker-build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: false
      - name: Load packaged DuckDB extensions offline on both platforms
        uses: step-security/docker-build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile.server
          target: extension-check
          platforms: linux/amd64,linux/arm64
          push: false

  publish:
    if: github.event_name == 'release' && github.repository == 'kenn-io/benchdb' && !github.event.release.prerelease && !github.event.release.draft
    runs-on: namespace-profile-linux-8cpu
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate the actual release tag and main ancestry
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          scripts/release_image.sh "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Build the validated commit
        env:
          RELEASE_REVISION: ${{ steps.release.outputs.revision }}
        run: |
          git checkout --detach "$RELEASE_REVISION"
          test "$(git rev-parse HEAD)" = "$RELEASE_REVISION"
      - uses: step-security/setup-qemu-action@v4.4.0
        with:
          platforms: arm64
      - uses: step-security/setup-buildx-action@v4.4.1
      - uses: step-security/docker-login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the release image
        id: image
        uses: step-security/docker-build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          build-args: |
            BENCHDB_REVISION=${{ steps.release.outputs.revision }}
          labels: |
            org.opencontainers.image.source=https://github.com/kenn-io/benchdb
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.revision }}
      - name: Record immutable deployment reference
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          # shellcheck disable=SC2016
          printf 'Deploy image: `%s@%s`\n' "$RELEASE_IMAGE" "$RELEASE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
