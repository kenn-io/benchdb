name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CGO_ENABLED: "1"
  GOTRACEBACK: all
  # "|" falls back to the source repo on any proxy error, including HTTP/2 stream resets mid-download.
  GOPROXY: https://proxy.golang.org|direct
  # Module-relative source paths let every checkout share Go build cache entries.
  GOFLAGS: -trimpath

jobs:
  go:
    env:
      DOWNLOAD_RETRY: kit-retry 3 5
    runs-on: namespace-profile-linux-8cpu
    # Lint and vet run before make go-test, which allows its tests 30 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3
      - name: Install golangci-lint v2.13.1
        run: |
          cd /tmp
          kit-download https://github.com/golangci/golangci-lint/releases/download/v2.13.1/golangci-lint-2.13.1-linux-amd64.tar.gz golangci-lint-2.13.1-linux-amd64.tar.gz
          kit-download https://github.com/golangci/golangci-lint/releases/download/v2.13.1/golangci-lint-2.13.1-checksums.txt golangci-lint-2.13.1-checksums.txt
          grep -E 'golangci-lint-2.13.1-linux-amd64\.tar\.gz$' golangci-lint-2.13.1-checksums.txt | sha256sum -c -
          tar -xzf golangci-lint-2.13.1-linux-amd64.tar.gz
          sudo install golangci-lint-2.13.1-linux-amd64/golangci-lint /usr/local/bin/golangci-lint
          golangci-lint version
      - run: make migration-history-check
      - run: GOFLAGS="${GOFLAGS:+$GOFLAGS }-n" kit-retry 3 5 make huma-check lint-workflow-retries
      - run: make huma-check
      - run: make go-lint-ci
      - name: Install Windows C/C++ cross compiler
        run: kit-retry 3 5 sudo apt-get -o APT::Update::Error-Mode=any update && kit-retry 3 5 sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64
      - name: Run lint for Windows
        env:
          GOOS: windows
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
        run: make go-lint-ci
      - run: make go-vet
      - run: make go-test

  archive-coordination:
    name: archive-coordination (${{ matrix.name }})
    runs-on: namespace-profile-linux-8cpu
    # Each of the two go test runs below may take up to 30 minutes.
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: postgres-15
            image: postgres:15.2-alpine
          # Keep in sync with Postgres17Image in internal/dbtest/archive.go.
          - name: postgres-17
            image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    env:
      BENCHDB_TEST_ARCHIVE_POSTGRES_IMAGE: ${{ matrix.image }}
      BENCHDB_DUCKDB_EXTENSION_DIR: ${{ github.workspace }}/.cache/duckdb/extensions
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Require a selected PostgreSQL image
        run: test -n "$BENCHDB_TEST_ARCHIVE_POSTGRES_IMAGE"
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3
      - run: make duckdb-extensions
        env:
          DOWNLOAD_RETRY: kit-retry 3 5
      # No -short: the harness fails, not skips, when Docker or an image is
      # missing. The remote tests start a disposable S3-compatible service
      # (dbtest.S3Image) with fixture credentials. Later archive tasks add
      # their packages and -run patterns here.
      - name: Run archive coordination tests
        run: |
          go test -shuffle=on -timeout 30m ./internal/dbtest/...
          go test -shuffle=on -timeout 30m ./internal/columnar \
            -run '^(TestSessionGuardAcrossWorkingDirectories|TestCleanupQueuesBehindActiveReader|TestGuardSessionLost|TestScheduledMaintenanceSkipsWhenOwnedElsewhere|TestScheduledMaintenanceFollowsSharedSchedule|TestLostOwnerLeavesSharedSchedule|TestInheritedArchiveTimeouts|TestArchiveConnectionBudget|TestCoordinationRejectsTransactionPooling|TestRemoteIdentityAndRestart|TestRemoteBindingRejectsChangedLocation|TestRemoteNamespaceClaim|TestAWSCredentialRefresh)$'

  web:
    runs-on: namespace-profile-linux-4cpu
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: step-security/setup-bun@v2.1.3
        with:
          bun-version: 1.4.4
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3
      - run: kit-retry 3 5 bun install --frozen-lockfile
      - run: bun run check
      - run: bun run check:e2e
      - run: bun run check:docs-screenshots
      - run: bun run test

  docs:
    env:
      DOWNLOAD_RETRY: kit-retry 3 5
    runs-on: namespace-profile-linux-4cpu
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3
      - run: make build-docs-ci

  docs-screenshots:
    runs-on: namespace-profile-linux-8cpu
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3
      - name: Capture dashboard screenshots
        env:
          DOWNLOAD_RETRY: kit-retry 3 5
          BENCHDB_DOCS_SCREENSHOT_OUT_DIR: ${{ runner.temp }}/benchdb-dashboard-screenshots
        run: make docs-screenshots
      - name: Check dashboard screenshot inventory
        env:
          BENCHDB_DOCS_SCREENSHOT_OUT_DIR: ${{ runner.temp }}/benchdb-dashboard-screenshots
        run: make docs-screenshots-check
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: benchdb-dashboard-screenshots
          path: |
            ${{ runner.temp }}/benchdb-dashboard-screenshots/*.png
            ${{ runner.temp }}/benchdb-dashboard-screenshots/dashboard-screenshots-evidence.json
          if-no-files-found: error
          retention-days: 14

  codegen-drift:
    env:
      DOWNLOAD_RETRY: kit-retry 3 5
    runs-on: namespace-profile-linux-4cpu
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: step-security/setup-bun@v2.1.3
        with:
          bun-version: 1.4.4
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3
      - name: Install sqlc v1.30.0
        run: |
          cd /tmp
          kit-download https://github.com/sqlc-dev/sqlc/releases/download/v1.30.0/sqlc_1.30.0_linux_amd64.tar.gz sqlc_1.30.0_linux_amd64.tar.gz
          echo "468aecee071bfe55e97fcbcac52ea0208eeca444f67736f3b8f0f3d6a106132e  sqlc_1.30.0_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf sqlc_1.30.0_linux_amd64.tar.gz sqlc
          sudo install sqlc /usr/local/bin/sqlc
          sqlc version
      - run: make sqlc-check
      - run: make codegen-check

  build:
    env:
      DOWNLOAD_RETRY: kit-retry 3 5
    runs-on: namespace-profile-linux-8cpu
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: step-security/setup-bun@v2.1.3
        with:
          bun-version: 1.4.4
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3
      - run: make build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: benchdb-binaries
          path: |
            bin/benchdb
            .cache/duckdb/extensions
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  server-container:
    env:
      DOWNLOAD_RETRY: kit-retry 3 5
    runs-on: namespace-profile-linux-8cpu
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3
      - run: kit-retry 3 5 docker compose -f docker-compose.server.yml pull --policy missing db
      - run: make server-image-extension-check
      - run: make server-container-smoke
      # Check the dashboard and the API reference at /docs as the binary serves them.
      - name: Start the server for the first-paint check
        env:
          DCOMP_BENCHDB_SERVER_HOST_PORT: 127.0.0.1:18080
        run: make server-container-up
      # /docs is left out: Huma's API reference page loads its stylesheet from a CDN
      # and cannot inline the hold script until BenchDB serves that page itself.
      - name: Check first paint
        uses: kenn-io/actions/first-paint@main
        with:
          urls: |
            http://127.0.0.1:18080/
            http://127.0.0.1:18080/series
            http://127.0.0.1:18080/results
            http://127.0.0.1:18080/compare
            http://127.0.0.1:18080/storage
      - name: Stop the server
        if: always()
        run: make server-container-down

  deploy-manifests:
    runs-on: namespace-profile-linux-4cpu
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: make go-deploy-manifest-check

  workflows:
    env:
      DOWNLOAD_RETRY: kit-retry 3 5
    runs-on: namespace-profile-linux-4cpu
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3
      - run: make docs-link-check
      - run: make docs-screenshots-check

  e2e:
    env:
      DOWNLOAD_RETRY: kit-retry 3 5
    runs-on: namespace-profile-linux-8cpu
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: step-security/setup-bun@v2.1.3
        with:
          bun-version: 1.4.4
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.12.1"
          package-manager-cache: false
      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3
      - name: Install web deps (pinned Playwright CLI)
        working-directory: web
        run: kit-retry 3 5 bun install --frozen-lockfile
      - name: Cache Playwright browsers
        # Keep the version in the key in sync with web/package.json @playwright/test.
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.64.1-${{ runner.os }}
      - name: Install Chromium
        working-directory: web
        run: kit-retry 3 5 bunx playwright install --with-deps chromium
      - name: Keystone e2e
        env:
          BENCHDB_E2E_SKIP_BROWSER_INSTALL: "1"
        run: make e2e
