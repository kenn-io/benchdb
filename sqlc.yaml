version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/db/migrations"
    queries: "internal/db/query"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              package: "googleuuid"
              type: "UUID"
          - column: "archive_storage.id"
            go_type:
              import: "uuid"
              type: "UUID"
          - column: "archive_storage.dataset_id"
            go_type:
              import: "uuid"
              type: "UUID"
          - column: "archive_cycle.id"
            go_type:
              import: "uuid"
              type: "UUID"
          - column: "archive_file_location.id"
            go_type:
              import: "uuid"
              type: "UUID"
          - column: "archive_lookup_partition.id"
            go_type:
              import: "uuid"
              type: "UUID"
          - column: "archive_lookup_segment.partition_id"
            go_type:
              import: "uuid"
              type: "UUID"
          - column: "archive_lookup_segment.storage_id"
            go_type:
              import: "uuid"
              type: "UUID"
          - column: "archive_object.storage_id"
            go_type:
              import: "uuid"
              type: "UUID"
          - column: "archive_orphan.storage_id"
            go_type:
              import: "uuid"
              type: "UUID"
          - column: "archive_retirement.storage_id"
            go_type:
              import: "uuid"
              type: "UUID"
          - column: "archive_upload.storage_id"
            go_type:
              import: "uuid"
              type: "UUID"
          - column: "archive_upload.cycle_id"
            go_type:
              import: "uuid"
              type: "UUID"
          - column: "archive_transfer.id"
            go_type:
              import: "uuid"
              type: "UUID"
          - column: "archive_transfer.source_storage_id"
            go_type:
              import: "uuid"
              type: "UUID"
          - column: "archive_transfer.destination_storage_id"
            go_type:
              import: "uuid"
              type: "UUID"
          - column: "archive_transfer_object.transfer_id"
            go_type:
              import: "uuid"
              type: "UUID"
          # The aggregate columns and per-iteration data/times are floats in the
          # stats core; map numeric -> float64 (and numeric[] -> []float64).
          - db_type: "pg_catalog.numeric"
            go_type: "float64"
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type:
              type: "float64"
              pointer: true
          - db_type: "pg_catalog.timestamp"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "pg_catalog.timestamp"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          # benchmark_result.data/times are per-iteration samples where an
          # element can be NULL (a missing iteration, legacy parity). Column
          # overrides beat the catch-all numeric mapping above, so every other
          # numeric[] stays []float64.
          - column: "benchmark_result.data"
            go_type:
              type: "float64"
              pointer: true
              slice: true
          - column: "benchmark_result.times"
            go_type:
              type: "float64"
              pointer: true
              slice: true
          - column: "benchmark_result_local.data"
            go_type:
              type: "float64"
              pointer: true
              slice: true
          - column: "benchmark_result_local.times"
            go_type:
              type: "float64"
              pointer: true
              slice: true
