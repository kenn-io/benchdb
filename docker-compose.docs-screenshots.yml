services:
  docs-screenshots-runner:
    build:
      context: .
      dockerfile: Dockerfile.docs-screenshots
      args:
        BUN_VERSION: "1.3.14"
        PLAYWRIGHT_VERSION: "1.60.0"
    environment:
      BENCHDB_DOCS_SCREENSHOT_BASE_URL: "http://server:8080"
      BENCHDB_DOCS_SCREENSHOT_OUT_DIR: "/screenshots"
      BENCHDB_DOCS_SCREENSHOT_PUBLIC_BASE_URL: "${BENCHDB_DOCS_SCREENSHOT_PUBLIC_BASE_URL:?BENCHDB_DOCS_SCREENSHOT_PUBLIC_BASE_URL must be set}"
      BENCHDB_DOCS_SCREENSHOT_COLOR_SCHEME: "${BENCHDB_DOCS_SCREENSHOT_COLOR_SCHEME:-light}"
      HOME: "/tmp"
    user: "${BENCHDB_DOCS_SCREENSHOT_UID:-0}:${BENCHDB_DOCS_SCREENSHOT_GID:-0}"
    volumes:
      - type: bind
        source: "${BENCHDB_DOCS_SCREENSHOT_OUT_DIR:?BENCHDB_DOCS_SCREENSHOT_OUT_DIR must be set}"
        target: /screenshots
    depends_on:
      server:
        condition: service_healthy
